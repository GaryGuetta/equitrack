# Déploie automatiquement le site sur alwaysdata à chaque push sur main.
#
# À configurer une fois dans GitHub : Settings → Secrets and variables → Actions → New repository secret
#   ALWAYSDATA_HOST      ssh-<compte>.alwaysdata.net
#   ALWAYSDATA_USER      ton nom de compte alwaysdata
#   ALWAYSDATA_PASSWORD  le mot de passe SSH de ce compte
#   ALWAYSDATA_PATH      dossier du projet sur le serveur, par exemple /home/<compte>/equitrack
#
# Le fichier .env.local (APP_ENV=prod, DATABASE_URL, etc.) reste sur le serveur : il n'est jamais dans Git.

name: Déploiement alwaysdata

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » pour relancer à la main

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mise à jour du site par SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ALWAYSDATA_HOST }}
          username: ${{ secrets.ALWAYSDATA_USER }}
          password: ${{ secrets.ALWAYSDATA_PASSWORD }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.ALWAYSDATA_PATH }}"
            git pull --ff-only
            composer install --no-dev --optimize-autoloader --no-interaction
            php bin/console doctrine:migrations:migrate --no-interaction --allow-no-migration
            php bin/console asset-map:compile
            php bin/console cache:clear
            echo "Site à jour : $(git log -1 --format='%h %s')"
